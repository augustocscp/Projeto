name: DevSecOps Pipeline

on:
  pull_request:
  push:
  schedule:
    - cron: "5  19 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

jobs:
  security-pipeline:
    uses: gestaosian/security-pipeline/.github/workflows/devsecops-pipeline.yml@v0
    secrets: inherit
    with:
      enable_sast: true
      enable_sca: true
      enable_secrets: true
      enable_iac: true
      block_all_critical: true
      block_all_high: false
      block_all_medium: false
      block_all_low: false
      publish_defectdojo: true
